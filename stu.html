    <style>
        /* ===== 学生列表表格样式 ===== */
        .stu-table-wrap {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 2.5em;
        }

        .stu-table {
            width: 100%;
            min-width: 500px;
            border-collapse: collapse;
            font-size: 15px;
            border: 1px solid #d9e2ec;
            border-radius: 6px;
            overflow: hidden;
        }

        /* 表头 */
        .stu-table thead th {
            background: #34495e;
            color: #ffffff;
            text-align: left;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 15px;
            white-space: nowrap;
            border-bottom: 2px solid #22303f;
        }

        .stu-table thead th.col-year,
        .stu-table thead th.col-extra {
            text-align: center;
        }

        /* 数据单元格 */
        .stu-table td {
            padding: 10px 16px;
            border-bottom: 1px solid #e6ecf2;
            vertical-align: middle;
            line-height: 1.6;
        }

        .stu-table td.col-name {
            font-weight: 600;
            color: #22303f;
        }

        .stu-table td.col-year,
        .stu-table td.col-extra {
            text-align: center;
        }

        /* ===== 入学年份分隔行：醒目样式 ===== */
        .stu-table tr.year-row td {
            background: #1f4e79;            /* 深蓝背景 */
            color: #ffffff;                 /* 白色文字 */
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            text-align: center;
            padding: 10px 16px;
            border-top: 3px solid #0d2b45;
            border-bottom: 3px solid #0d2b45;
            border-left: 6px solid #e67e22; /* 左侧橙色竖条 */
        }

        /* 第一组分隔行去掉顶部粗边框，避免与表头重叠 */
        .stu-table tbody:first-of-type tr.year-row td {
            border-top: none;
        }

        /* 相邻两行不同颜色（斑马纹） */
        .stu-table tbody tr.data-row:nth-child(odd) {
            background-color: #ffffff;
        }

        .stu-table tbody tr.data-row:nth-child(even) {
            background-color: #f4f9fd;
        }

        /* 鼠标悬停高亮 */
        .stu-table tbody tr.data-row:hover {
            background-color: #e3f1ff;
        }

        /* 小屏幕适配 */
        @media (max-width: 640px) {
            .stu-table {
                font-size: 13px;
                min-width: 400px;
            }

            .stu-table thead th,
            .stu-table td {
                padding: 8px 10px;
            }

            .stu-table tr.year-row td {
                font-size: 14px;
                padding: 8px 10px;
            }
        }
    </style>
